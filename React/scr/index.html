<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Document</title>
</head>
<style>
:root{
 --box-style:'size-60 shadow-md rounded-md'
}
body{
  display: flex;
  flex-direction:column;
  align-items: center;
  justify-content: center;
  height: 100vh;
  border: 2px dashed red;
}
.box{
   width: 240px;
   height: 240px;
   box-shadow: rgb(211, 211, 211) 2px 4px 2px; 
   border-radius: 0.31rem;
}
.flex-1{
  display:flex;
  max-width: 80vw;
  max-height: 60vh;
  margin: 1rem;
  gap:0.95rem;
  box-sizing: border-box;
  flex-wrap: wrap;
  border: 2px dashed blue;
}
.anime{
  animation-name:diagonal;
  animation-duration:2s;
  animation-iteration-count: infinite ;
  animation-direction: alternate;
}
.anime-1{
  animation-name:up_down;
  animation-duration:2s;
  animation-iteration-count: infinite ;
  animation-direction: alternate;
}
.anime-2{
  animation-name:curved-x,curved-y;
  animation-duration:2s;
  animation-iteration-count: infinite ;
  animation-direction: linear;
}
.anime-3{
  animation-name:circle-x;
  animation-duration:3s;
  animation-iteration-count: infinite ;
  animation-direction: linear;
}

@keyframes diagonal{
 to{translate:200px 200px;}
}
@keyframes up_down{
 to{translate:0px 200px;}
}
@keyframes curved-x{
   100%{translate:200px 0}
}
@keyframes curved-y{
   34%{transform: translateY(100px);} 
   100%{transform: translateY(0px);}
}

@keyframes circle-x{
    0% { transform: rotate(0deg)  translateY(100px) rotate(0deg); } 
    100% { transform: rotate(360deg)  translateY(100px) rotate(-360deg); } 
}


</style>
<body>
<div class="text-xl font-bold text-center text-red-500">Testing animation</div>
<div class="flex-1">
    <div class="box">
        <div class= "bg-red-600 size-5 rounded-full anime"></div>
    </div>
    <div class="size-60 shadow-md rounded-md flex justify-center ">
        <div class= "bg-red-600 size-5 rounded-full anime-1"></div>
    </div>
    <div class="size-60 shadow-md rounded-md">
        <div class= "bg-red-600 size-5 rounded-full anime-2 "></div>
    </div>
    <div class="size-60 shadow-md rounded-md flex justify-center items-center">
        <div class= "bg-red-600 size-5 rounded-full mt-4 anime-3"></div>
    </div>
</div>
</body>
<script src="second.js" type="module"></script>
</html>
